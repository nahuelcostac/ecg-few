[project]
name = "ecg-vlm"
version = "0.1.0"
description = "Patient-level few-shot ECG image experiments with CNNs and vision-language models."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "openai>=2.35.1",
    "pandas>=2.2",
    "pillow>=10.4",
    "pydantic>=2.8",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
]

[project.optional-dependencies]
cnn = [
    "torch>=2.3",
    "torchvision>=0.18",
]
real-data = [
    "wfdb>=4.1",
]
vlm-local = [
    "torch>=2.3",
    "transformers>=4.57",
    "accelerate>=1.0",
    "sentencepiece>=0.2",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
ecg-few = "ecg_few.cli.main:main"

[project.urls]
Repository = "https://github.com/nahuelcostac/ecg-few"
Issues = "https://github.com/nahuelcostac/ecg-few/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecg_few"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/scripts/run",
    "/scripts/verify_wheel.py",
    "/configs",
    "/tests/unit",
    "/tests/integration",
    "/tests/conftest.py",
    "/tests/fixtures",
    "/docs",
    "/data/README.md",
    "/README.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/CITATION.cff",
    "/AGENTS.md",
    "/pyproject.toml",
    "/uv.lock",
]
exclude = ["/scripts/run/*tfg*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["scripts/thesis", "thesis", "old", "tmp", "output", "outputs"]
include = [
    "pyproject.toml",
    "src/**/*.py",
    "scripts/verify_wheel.py",
    "tests/unit/**/*.py",
    "tests/integration/**/*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "--import-mode=importlib --strict-config --strict-markers"
markers = ["integration: exercises multiple components with generated data"]
